[package]
name = "pleme-igata"
version = "0.1.6"
edition = "2021"
description = "Nix-first machine image builder — Packer-compatible JSON templates"
license = "MIT"
authors = ["Pleme Team <team@pleme.io>"]
repository = "https://github.com/pleme-io/igata"
homepage = "https://github.com/pleme-io/igata"
keywords = ["packer", "image", "builder", "nix", "vm"]
categories = ["development-tools", "command-line-utilities"]
exclude = ["module/", "target/", "result-*", "Cargo.nix", "flake.nix", "flake.lock"]

[[bin]]
name = "igata"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
anyhow = "1.0"
thiserror = "2.0"
colored = "2.1"
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
shikumi = "0.1"
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
dirs = "6.0"
gtmpl = "0.7"
gtmpl_value = "0.5"

# Communicators
russh = "0.48"
russh-keys = "0.48"
ssh-key = "0.6"
bollard = "0.18"
futures-util = "0.3"

# AWS
aws-config = "1"
aws-sdk-ec2 = "1"

# amazon-import builder: reuses ami-forge's own proven upload/import/tag/SSM
# pipeline in-process rather than re-deriving it or shelling out.
#
# `version` alongside `path` — and the version is what makes this crate
# publishable at all. A BARE path dep carries no version requirement, and
# `cargo package` refuses one outright:
#
#   all dependencies must have a version requirement specified when packaging.
#   dependency `ami-forge` does not specify a version
#
# That is why `pleme-igata` has never appeared on crates.io despite having a
# release shim, zero git deps and a green-looking pipeline — the manifest was
# structurally unpublishable, and the failure sat in a step nobody read.
#
# The comment this replaces called publishing ami-forge "a follow-up". It
# landed 2026-08-07 (ami-forge 0.2.1, its first release), so the follow-up is
# now closed rather than restated.
#
# Note the two coordinates are different things: `path` is what a local build
# compiles against, `version` is what a published consumer resolves. They can
# drift silently, and only `cargo package` WITHOUT --no-verify catches it.
# Registry only — NO `path`.
#
# A `{ path, version }` dep still requires the path to RESOLVE, even though
# packaging substitutes the version. On a CI runner there is no sibling
# checkout, so the release step died with:
#
#   failed to get `ami-forge` as a dependency of package `pleme-igata v0.1.4`
#     failed to load source for dependency `ami-forge`
#     failed to read `/home/runner/work/igata/ami-forge/Cargo.toml`
#
# The path existed for local co-development, which stopped being worth
# anything the moment ami-forge reached the registry (0.2.1, its first
# release, 2026-08-07). Keeping it made this crate unshippable a SECOND time,
# one layer past the missing-version blocker fixed in 15f571e.
#
# Re-add a path override in `.cargo/config.toml` or a `[patch]` section if
# local co-development is ever wanted again — not in the manifest that ships.
ami-forge = "0.2"

# Post-processors
sha2 = "0.10"
md-5 = "0.10"
flate2 = "1"
zip = "2"
tar = "0.4"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
